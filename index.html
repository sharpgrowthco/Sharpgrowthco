<script>
(() => {
  const heroPattern = /homepage-hero-laptop|Hero|hero/i;
  const tuneImage = (img) => {
    if (!img || img.dataset.sgcPerfTuned === 'true') return;
    const source = `${img.currentSrc || ''} ${img.src || ''} ${img.alt || ''}`;
    img.decoding = 'async';
    if (heroPattern.test(source)) {
      img.loading = 'eager';
      img.fetchPriority = 'high';
    } else {
      img.loading = 'lazy';
      img.fetchPriority = 'low';
    }
    img.dataset.sgcPerfTuned = 'true';
  };
  const tuneTree = (root) => {
    if (root?.tagName === 'IMG') tuneImage(root);
    root?.querySelectorAll?.('img')?.forEach(tuneImage);
  };
  tuneTree(document.documentElement);
  new MutationObserver((mutations) => {
    mutations.forEach((mutation) => mutation.addedNodes.forEach(tuneTree));
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
